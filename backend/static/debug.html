<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prowl Debug</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #6b7280; --line: #d9dde3;
    --free: #ffffff; --wall: #1d2330; --ok: #15803d; --warn: #c2410c; --bad: #b91c1c; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --ink: #e5e7eb; --muted: #9aa3b2; --line: #2a303b;
      --free: #232a36; --wall: #e5e7eb; --ok: #4ade80; --warn: #fb923c; --bad: #f87171; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .pill { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); font-size: 12px; }
  .pill.on { color: var(--ok); border-color: currentColor; }
  .pill.off { color: var(--bad); border-color: currentColor; }
  .stat { color: var(--muted); font-size: 13px; }
  .stat b { color: var(--ink); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  #mapwrap { position: relative; min-height: 420px; padding: 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; min-height: 420px; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .warn { color: var(--warn); }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input { font: inherit; width: 100%; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
          background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sess { display: flex; justify-content: space-between; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); }
  .sess:first-child { border-top: 0; }
  .sess small { color: var(--muted); display: block; }
  #log { font: 12px ui-monospace, monospace; color: var(--muted); max-height: 140px; overflow: auto; white-space: pre-wrap; }
  progress { width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Prowl · debug view</h1>
  <span id="conn" class="pill off">server: connecting</span>
  <span id="robot" class="pill off">robot: none</span>
  <span class="stat">session <b id="sname">–</b></span>
  <span class="stat">mode <b id="mode">–</b></span>
  <span class="stat">battery <b id="batt">–</b></span>
  <span class="stat">explored <b id="explored">–</b></span>
  <span class="stat">msgs/s <b id="rate">0</b></span>
</header>
<main>
  <div class="card" id="mapwrap">
    <canvas id="cv"></canvas>
    <div id="hint">Amber circles: camera samples. Triangles: lidar obstacles.</div>
  </div>
  <aside>
    <div class="card" id="replaybox" hidden>
      <h2>Replay</h2>
      <progress id="rprog" value="0" max="1"></progress>
      <div class="row" style="margin-top:6px">
        <button id="rpause">Pause</button>
        <button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="10">10×</button>
        <button id="rlive">Back to live</button>
      </div>
    </div>
    <div class="card">
      <h2>Warnings</h2>
      <ul id="warnings"><li>none yet</li></ul>
    </div>
    <div class="card">
      <h2>Robot controls</h2>
      <div class="row" id="cmds">
        <button data-cmd="pause">Pause</button><button data-cmd="resume">Resume</button>
      </div>
      <div style="margin-top:8px"><input id="token" placeholder="operator token" type="password"></div>
    </div>
    <div class="card">
      <h2>Sessions</h2>
      <div id="sessions">loading…</div>
    </div>
    <div class="card"><h2>Events</h2><div id="log"></div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const state = { latest: {}, trail: [], reviews: {}, reports: [], session: null, canCommand: false, mapImg: null, bounds: null, replay: null };
let ws = null, wsKind = "live", retry = 0, msgCount = 0;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function logEvent(text) {
  const el = $("log");
  el.textContent = new Date().toLocaleTimeString() + "  " + text + "\n" + el.textContent.slice(0, 4000);
}
function getToken() { try { return localStorage.getItem("prowl_token") || ""; } catch { return ""; } }
$("token").value = getToken();
$("token").addEventListener("change", () => {
  try { localStorage.setItem("prowl_token", $("token").value); } catch {}
  if (wsKind === "live") connectLive();
});

// ---------------------------------------------------------------- sockets
function wsUrl(path) { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + path; }

function open(url, kind) {
  if (ws) { ws.onclose = null; ws.close(); }
  wsKind = kind;
  ws = new WebSocket(url);
  ws.onopen = () => { retry = 0; setPill("conn", true, "server: connected"); };
  ws.onmessage = (e) => { msgCount++; handle(JSON.parse(e.data)); };
  ws.onclose = () => {
    setPill("conn", false, "server: disconnected");
    if (wsKind === "live") setTimeout(connectLive, Math.min(5000, 500 * 2 ** retry++));
  };
}
function connectLive() {
  $("replaybox").hidden = true; state.replay = null;
  const t = getToken();
  open(wsUrl("/ws/dashboard" + (t ? "?token=" + encodeURIComponent(t) : "")), "live");
}
function startReplay(id) {
  $("replaybox").hidden = false; state.replay = { duration: 1, paused: false };
  $("rpause").textContent = "Pause";
  open(wsUrl("/ws/replay/" + encodeURIComponent(id) + "?speed=4"), "replay");
}
function sendCommand(name, args = {}) {
  if (wsKind !== "live" || !ws || ws.readyState !== 1) return logEvent("not connected to a live session");
  ws.send(JSON.stringify({ type: "command", name, args }));
}

// ---------------------------------------------------------------- messages
function handle(m) {
  switch (m.type) {
    case "snapshot":
      state.latest = m.latest || {}; state.trail = m.trail || []; state.session = m.session;
      state.reviews = m.reviews || {}; state.reports = m.reports || [];
      state.canCommand = !!m.can_command; state.bounds = null; state.mapImg = null;
      if (state.latest.map) loadMap(state.latest.map);
      refreshHeader(); refreshWarnings(); draw();
      logEvent(m.session ? "snapshot for " + m.session.name : "waiting for a robot to connect");
      break;
    case "pose":
      state.latest.pose = m;
      const t = state.trail, last = t[t.length - 1];
      if (!last || Math.hypot(m.x - last[0], m.y - last[1]) > 0.05) t.push([m.x, m.y]);
      break;
    case "map": state.latest.map = m; loadMap(m); break;
    case "scan": state.latest.scan = m; break;
    case "detections": state.latest.detections = m; break;
    case "analysis": state.latest.analysis = m; refreshWarnings(); refreshHeader(); break;
    case "status": state.latest.status = m; refreshHeader(); break;
    case "robot_connected": if (state.session) state.session.robot_connected = true; refreshHeader();
      logEvent("robot " + (m.resumed ? "reconnected" : "connected")); break;
    case "robot_disconnected": if (state.session) state.session.robot_connected = false; refreshHeader();
      logEvent("robot disconnected; session stays open " + m.resume_window_s + " s"); break;
    case "session_ended": if (state.session) state.session.live = false; refreshHeader();
      logEvent("session ended: " + m.reason); loadSessions(); break;
    case "mission": state.latest.mission = m; break;
    case "review": state.reviews[m.finding_id] = { ...(state.reviews[m.finding_id] || {}), ...m };
      logEvent(`review ${m.finding_id}: ${m.status ?? ""}${m.note != null ? " (note)" : ""}`); break;
    case "report": state.reports.push(m); logEvent(`report queued for ${m.finding_id}: ${m.status}`); break;
    case "command": logEvent("command sent: " + m.name + " " + JSON.stringify(m.args)); break;
    case "error": logEvent("error: " + m.error); break;
    case "replay_start": state.replay = { duration: m.duration_s || 1, paused: false };
      logEvent("replaying " + m.messages + " messages (" + m.duration_s.toFixed(0) + " s)"); break;
    case "replay_end": logEvent("replay finished"); $("rprog").value = 1; break;
  }
  if (m.replay_t !== undefined && state.replay) $("rprog").value = m.replay_t / state.replay.duration;
}

function loadMap(m) {
  const img = new Image();
  img.onload = () => {
    // Recolour the grayscale map: free -> panel colour, wall -> ink, unknown -> transparent.
    const off = document.createElement("canvas");
    off.width = img.width; off.height = img.height;
    const o = off.getContext("2d");
    o.drawImage(img, 0, 0);
    const px = o.getImageData(0, 0, off.width, off.height), d = px.data;
    const free = hexToRgb(css("--free")), wall = hexToRgb(css("--wall"));
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i];
      const c = v > 230 ? free : v < 60 ? wall : null;
      if (c) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; } else d[i + 3] = 0;
    }
    o.putImageData(px, 0, 0);
    state.mapImg = { canvas: off, meta: m };
    const [ox, oy] = m.origin, w = m.width * m.resolution, h = m.height * m.resolution;
    growBounds(ox, oy, ox + w, oy + h);
  };
  img.src = "data:image/png;base64," + m.data;
}
function hexToRgb(h) {
  h = h.replace("#", "");
  return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
}
function growBounds(x0, y0, x1, y1) {  // only grow, so the view doesn't jump around
  const b = state.bounds;
  state.bounds = b ? [Math.min(b[0], x0), Math.min(b[1], y0), Math.max(b[2], x1), Math.max(b[3], y1)] : [x0, y0, x1, y1];
}

// ---------------------------------------------------------------- drawing
let view = { s: 1, ox: 0, oy: 0, maxY: 0, minX: 0 };
function toPx(x, y) { return [view.ox + (x - view.minX) * view.s, view.oy + (view.maxY - y) * view.s]; }

function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const b = state.bounds || [-1, -1, 15, 10], pad = 20;
  const s = Math.min((W - 2 * pad) / (b[2] - b[0]), (H - 2 * pad) / (b[3] - b[1]));
  view = { s, minX: b[0], maxY: b[3], ox: (W - (b[2] - b[0]) * s) / 2, oy: (H - (b[3] - b[1]) * s) / 2 };
  const L = state.latest, ink = css("--ink");

  if (state.mapImg) {
    const m = state.mapImg.meta, [x, y] = toPx(m.origin[0], m.origin[1] + m.height * m.resolution);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(state.mapImg.canvas, x, y, m.width * m.resolution * s, m.height * m.resolution * s);
  }
  // trail
  ctx.beginPath();
  state.trail.forEach(([x, y], i) => { const p = toPx(x, y); i ? ctx.lineTo(...p) : ctx.moveTo(...p); });
  ctx.strokeStyle = css("--accent"); ctx.globalAlpha = 0.45; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
  // scan
  ctx.fillStyle = css("--bad");
  for (const [x, y] of L.scan?.points || []) { const [px, py] = toPx(x, y); ctx.fillRect(px - 1, py - 1, 2, 2); }
  // findings: camera samples (circles) and lidar obstacles (triangles)
  ctx.font = "12px system-ui"; ctx.textBaseline = "middle";
  for (const d of L.detections?.items || []) {
    const [px, py] = toPx(d.x, d.y), review = state.reviews[d.code] || {};
    ctx.beginPath();
    if (d.kind === "obstacle") { ctx.moveTo(px, py - 8); ctx.lineTo(px + 7, py + 6); ctx.lineTo(px - 7, py + 6); ctx.closePath(); }
    else ctx.arc(px, py, 6, 0, 7);
    ctx.fillStyle = d.kind === "obstacle" ? ink : css("--warn"); ctx.fill();
    const extra = d.kind === "obstacle" ? (d.size_m ? d.size_m.toFixed(1) + " m" : "") : Math.round(d.confidence * 100) + "%";
    ctx.fillStyle = ink;
    ctx.fillText(`${d.code || d.id} ${d.label.replace(/_/g, " ")} ${extra}${review.status ? " · " + review.status : ""}`, px + 10, py);
  }
  // robot
  if (L.pose) {
    const [px, py] = toPx(L.pose.x, L.pose.y), r = Math.max(8, 0.2 * s);
    ctx.save(); ctx.translate(px, py); ctx.rotate(-L.pose.theta);
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(-r * 0.7, r * 0.6); ctx.lineTo(-r * 0.7, -r * 0.6); ctx.closePath();
    ctx.fillStyle = css("--accent"); ctx.fill(); ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  }
  if (!state.session && !state.mapImg) {
    ctx.fillStyle = css("--muted"); ctx.textAlign = "center";
    ctx.fillText("Waiting for the robot… run backend/tools/fake_robot.py to test.", W / 2, H / 2); ctx.textAlign = "left";
  }
}
function loop() { draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);


// ---------------------------------------------------------------- side panels
function setPill(id, on, text) { const el = $(id); el.className = "pill " + (on ? "on" : "off"); el.textContent = text; }
function refreshHeader() {
  const s = state.session, st = state.latest.status, a = state.latest.analysis;
  $("sname").textContent = s ? s.name + (s.live === false ? " (ended)" : "") : "–";
  setPill("robot", !!s?.robot_connected, s?.robot_connected ? "robot: connected" : "robot: offline");
  $("mode").textContent = st?.mode ?? "–";
  $("batt").textContent = st?.battery_v != null ? st.battery_v.toFixed(2) + " V" : "–";
  $("explored").textContent = a?.explored_m2 != null ? a.explored_m2 + " m²" : "–";
  $("cmds").style.opacity = state.canCommand ? 1 : 0.4;
}
function refreshWarnings() {
  const w = state.latest.analysis?.warnings || [];
  $("warnings").innerHTML = w.length ? w.map((t) => `<li class="warn">${escapeHtml(t)}</li>`).join("") : "<li>none</li>";
}
function escapeHtml(t) { return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

async function loadSessions() {
  try {
    const list = await (await fetch("/api/sessions?limit=20")).json();
    $("sessions").innerHTML = list.length ? list.map((s) => `
      <div class="sess"><div>${escapeHtml(s.name)}<small>${new Date(s.started_at * 1000).toLocaleString()} · ${s.msg_count} msgs${s.live ? " · LIVE" : ""}</small></div>
      <button data-replay="${s.id}">Replay</button></div>`).join("") : "no sessions yet";
  } catch { $("sessions").textContent = "could not load sessions"; }
}
$("sessions").addEventListener("click", (e) => { const id = e.target.dataset.replay; if (id) startReplay(id); });
$("cmds").addEventListener("click", (e) => { if (e.target.dataset.cmd) sendCommand(e.target.dataset.cmd); });
$("rpause").addEventListener("click", () => {
  if (!state.replay || !ws) return;
  state.replay.paused = !state.replay.paused;
  ws.send(JSON.stringify({ type: "control", action: state.replay.paused ? "pause" : "resume" }));
  $("rpause").textContent = state.replay.paused ? "Resume" : "Pause";
});
$("replaybox").addEventListener("click", (e) => {
  if (e.target.dataset.speed && ws) ws.send(JSON.stringify({ type: "control", action: "speed", value: +e.target.dataset.speed }));
});
$("rlive").addEventListener("click", connectLive);
setInterval(() => { $("rate").textContent = msgCount; msgCount = 0; }, 1000);
setInterval(loadSessions, 10000);

loadSessions();
connectLive();
</script>
</body>
</html>
